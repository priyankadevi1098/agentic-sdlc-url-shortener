[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-url-shortener-assessment"
version = "0.1.0"
description = "An offline SDLC orchestration prototype and URL shortener."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["agentic_shortener"]

[tool.setuptools.package-data]
agentic_shortener = ["scenarios/*.json"]
